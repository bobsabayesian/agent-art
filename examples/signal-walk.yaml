# Signals act twice: once at drop (x, y, energy), then *while walking* (walk drivers),
# and one signal sets a species trait per agent (modulate).
seed: 21
agents: 90
canvas: {size: A4, margin: 20, border: {style: striped, width: 0.5, dash: 6, dash_gap: 3, pen: red, color: "#c0392b"}}
energy_range: [150, 420]
signals:
  vol:  {provider: synthetic, kind: walk, seed: 2, n: 400, label: fake volume}
  temp: {provider: synthetic, kind: sine, period: 120, n: 400, label: fake temperature}
  perf: {provider: synthetic, kind: walk, seed: 9, n: 400, label: fake return}
bind:
  x: {signal: vol}
  y: {signal: temp, invert: true}
modulate:
  turn_propensity: {signal: perf, span: [0.02, 0.3], species: [tracer]}   # bigger move -> wigglier agent
walk:
  - {signal: perf, target: heading, gain: 1.1, window: 0.2, species: [tracer]}   # line traces the chart
  - {signal: vol, target: step, gain: 0.6, window: 0.2, scale: rank}             # speeds up on busy days
species:
  - name: tracer
    pen: black
    color: "#111111"
    weight: 3
    init_angle: {mean: 0, sd: 11.55}
    like_x: 0.1
    step: {mean: 1.6, sd: 0.2309}
    momentum_decay: 0.9995
    min_step: 0.2
    thickness: 0.3
    comfort_distance: 5
    affinity_other: -0.2
  - name: looper
    pen: red
    color: "#c0392b"
    weight: 1
    goal: [circle, star]
    goal_size: {mean: 12, sd: 2.309}
    goal_strength: {mean: 0.8, sd: 0.05774}
    step: {mean: 1.3, sd: 0.1732}
    momentum_decay: 0.9995
    min_step: 0.3
    thickness: 0.4
