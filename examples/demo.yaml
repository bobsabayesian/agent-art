# Offline demo (synthetic signals). See examples/real.yaml for live data.
seed: 7
agents: 250
canvas: {width: 297, height: 210, margin: 10}   # mm (A4 landscape)
energy_range: [40, 350]                          # mm of line per agent
boundary: reflect

signals:
  vol:   {provider: synthetic, kind: walk, seed: 1, label: fake volume}
  temp:  {provider: synthetic, kind: sine, period: 60, label: fake temperature}
  perf:  {provider: synthetic, kind: walk, seed: 3, label: fake return}

bind:
  x:      {signal: vol}
  y:      {signal: temp}
  energy: {signal: perf, scale: rank}

species:
  - name: drifter
    pen: black
    color: "#111111"
    weight: 3
    thickness: [0.2, 0.4]
    like_x: [0.2, 0.8]
    turn_propensity: [0.05, 0.2]
    step: [1.5, 3]
    momentum_decay: [0.995, 1.0]
    affinity_same: 0.2
    affinity_other: -0.6
    comfort_distance: [4, 8]
    vision: 25
  - name: spiraler
    pen: red
    color: "#c0392b"
    weight: 1.5
    thickness: [0.3, 0.6]
    like_total_angle: [0.6, 1.0]
    turn_propensity: [0.1, 0.25]
    step: [2.5, 4]
    momentum_decay: [0.985, 0.995]
    min_step: 0.4
    affinity_same: 0.6
    affinity_other: 0.1
    comfort_distance: [6, 12]
    vision: 40
  - name: skitter
    pen: blue
    color: "#1f4e9c"
    weight: 2
    thickness: 0.2
    like_y: [-0.8, -0.2]
    turn_propensity: [0.3, 0.6]
    jitter: [0.2, 0.5]
    step: [0.8, 1.6]
    momentum_decay: 0.998
    affinity_same: -0.4
    affinity_other: 0.5
    comfort_distance: 3
    vision: 20
