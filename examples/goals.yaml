# Every agent traces a goal shape; noise, neighbors and walls bend it.
seed: 5
agents: 120
canvas: {size: Letter, orientation: landscape, margin: 25, border: {style: double, width: 0.4, gap: 2}}
energy_range: [200, 900]
signals:
  vol:  {provider: synthetic, kind: walk, seed: 1, label: fake volume}
  temp: {provider: synthetic, kind: sine, period: 40, label: fake temperature}
bind:
  x: {signal: vol}
  y: {signal: temp}
species:
  - name: roundish
    pen: black
    color: "#111111"
    weight: 2
    goal: [circle, figure8, heart]
    goal_size: {mean: 16, sd: 3.464}
    goal_strength: {mean: 0.825, sd: 0.07217}
    turn_propensity: {mean: 0.2, sd: 0.05774}
    step: {mean: 1.3, sd: 0.1732}
    momentum_decay: 0.9995
    min_step: 0.3
    thickness: 0.3
    affinity_other: -0.2
  - name: angular
    pen: red
    color: "#c0392b"
    weight: 2
    goal: [square, triangle, star, hexagon]
    goal_size: {mean: 13, sd: 2.887}
    goal_strength: {mean: 0.7, sd: 0.1155}
    turn_propensity: {mean: 0.25, sd: 0.0866}
    jitter: {mean: 0.075, sd: 0.0433}
    step: {mean: 1.3, sd: 0.1732}
    momentum_decay: 0.9995
    min_step: 0.3
    thickness: 0.4
  - name: wanderer
    pen: blue
    color: "#1f4e9c"
    goal: [spiral, wave, line]
    goal_size: {mean: 17.5, sd: 4.33}
    goal_strength: 0.8
    like_x: 0.5
    turn_propensity: 0.15
    step: {mean: 2, sd: 0.2887}
    momentum_decay: 0.999
    min_step: 0.3
    thickness: 0.25
