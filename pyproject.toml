[project]
name = "agent-art"
version = "0.1.0"
description = "Agent-based SVG generator driven by real-world signals"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
agent-art = "agent_art.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_art"]

[tool.pytest.ini_options]
testpaths = ["tests"]
